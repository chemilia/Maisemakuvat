{% extends "base.html" %}

{% block content %}
  {% if session.username %}
  <p>
    Hei, <a href="/user/{{session.user_id}}">{{ session.username }} </a>! Tervetuloa maisema-galleriaan!
  </p>
  {% endif %}

  <h2>Kuvat</h2>
  <ul>
    {% for photo in photos %}
    <li> <strong><a href="/user/{{photo.user_id}}">{{photo.username}}</a></strong>: <a href="/photo/{{photo.id}}">{{photo.description}} </a> </li>
    {% endfor %}
  </ul>

{% endblock %}
