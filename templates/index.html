{% extends "base.html" %}

{% block content %}
  {% if session.username %}
  <p>
    Hei, <a href="/user/{{session.user_id}}">{{ session.username }} </a>! Tervetuloa maisema-galleriaan!
  </p>
  {% endif %}

  <h2>Kuvat</h2>

  {% for photo in photos %}
  <div class="photo">
  <a href="/photo/{{photo.id}}">{{photo.description}} </a><br />
  Ilmoittaja: <strong><a href="/user/{{photo.user_id}}">{{photo.username}}</a></strong>
</div>
  {% endfor %}

{% endblock %}
