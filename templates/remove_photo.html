{% extends "base.html" %}

{% block content %}
     <h1>Kuvan poisto</h1>
     <p>Kuva: {{photo.description}}</p>
     <p>Haluatko varmasti poistaa tämän kuvan?</p>
  <form action="/remove_photo/{{photo.id}}" method="post">
      <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}" />
      <input type="submit" name="remove" value="Poista kuva">
      <input type="submit" name="back" value="Palaa Takaisin">
  </form>

{% endblock %}
