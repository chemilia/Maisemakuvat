{% extends "base.html" %}

{% block content %}
     <h1>Lisää uusi kuva</h1>
  <form action="/create_photo" method="post" enctype="multipart/form-data">
    <p>
      Valitse kuva:
      <input type="file" name="scenery" accpet="image/png,image/jpeg">
    </p>
    {% if error %}
    <p style="color:red">{{ error }}</p>
    {% endif %}
    <p>
      <label for="seasons">Valitse vuodenaika:</label>

        <select id="seasons" name="seasons">
            <option value="Kevät">Kevät</option>
            <option value="Kesä">Kesä</option>
            <option value="Syksy">Syksy</option>
            <option value="Talvi">talvi</option>
        </select>

        <label for="era">Valitse aikakausi:</label>

        <select id="era" name="era">
            <option value="2020">2020</option>
            <option value="2010">2010</option>
            <option value="2000">2000</option> 
            <option value="1990">1990</option>
            <option value="1980">1980</option>
            <option value="1970">1970</option>
            <option value="1960">1960</option>           
        </select>luku

    </p>
    <p>
        Kuvaus: <br />
        <textarea name="description" cols = "60" required maxlength = "200"></textarea>
    </p>
    <input type="submit" value="Lähetä kuva" />
  </form>

{% endblock %}
