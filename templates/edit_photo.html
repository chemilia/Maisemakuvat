{% extends "base.html" %}

{% block content %}

     <h1>Kuvan tiedon muokkaaminen</h1>
  <form action="/update_photo" method="post">
    <p>
      <label for="seasons">Valitse vuodenaika:</label>

        <select id="seasons" name="seasons">
            <option value="Kevät"
                {% if photo.seasons == "Kevät" %}selected{% endif %}>
                Kevät
            </option>

            <option value="Kesä"
                {% if photo.seasons == "Kesä" %}selected{% endif %}>
                Kesä
            </option>

            <option value="Syksy"
                {% if photo.seasons == "Syksy" %}selected{% endif %}>
                Syksy
            </option>

            <option value="Talvi"
                {% if photo.seasons == "Talvi" %}selected{% endif %}>
                Talvi
            </option>
        </select>

        <label for="era">Valitse aikakausi:</label>

        <select id="era" name="era">
            <option value="2020"
                {% if photo.era == 2020 %}selected{% endif %}>
                2020
            </option>

            <option value="2010"
                {% if photo.era == 2010 %}selected{% endif %}>
                2010
            </option>

            <option value="2000"
                {% if photo.era == 2000 %}selected{% endif %}>
                2000
            </option>

            <option value="1990"
                {% if photo.era == 1990 %}selected{% endif %}>
                1990
            </option>

            <option value="1980"
                {% if photo.era == 1980 %}selected{% endif %}>
                1980
            </option>

            <option value="1970"
                {% if photo.era == 1970 %}selected{% endif %}>
                1970
            </option>

            <option value="1960"
                {% if photo.era == 1960 %}selected{% endif %}>
                1960
            </option>
        </select>luku

    </p>
    <p>
        Kuvaus: <br />
        <textarea name="description" cols = "60">{{photo.description}}</textarea>
    </p>

    <input type="hidden" name="photo_id" value="{{photo.id}}" />
    <input type="submit" value="Päivitä tiedot" />
  </form>

{% endblock %}
