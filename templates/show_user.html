{% extends "base.html" %}

{% block content %}
    <h1>{{user.username}} </h1>
    <p>
      Käyttäjä on lähettännyt {{ photos | count}} kuvaa.
    </p>

  <h2>Kuvat</h2>
  {% for photo in photos %}
  <div class="photo">
  <a href="/photo/{{photo.id}}">{{photo.description}} </a>
  </div>
  {% endfor %}
{% endblock %}
