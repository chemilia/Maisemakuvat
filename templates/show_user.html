{% extends "base.html" %}

{% block content %}
    <h1>{{user.username}} </h1>
    <p>
        Käyttäjä on lähettännyt {{ photos | count}} kuvaa.
    </p>

    <h2>Kuvat</h2>
  <ul>
    {% for photo in photos %}
    <li> <a href="/photo/{{photo.id}}"> {{photo.description}} </a> </li>
    {% endfor %}
  </ul>

    <p>
        <a href="/">Takaisin</a>
    </p>

{% endblock %}
